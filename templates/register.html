<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="A few details to create your patient account. Smart Appointment &amp; Virtual Queue Management System, a single scanning centre appointment system.">
    <meta name="theme-color" content="#6d28d9">
    <title>Create your patient profile | Scanova</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <!-- BACKEND DATA: Flask can safely serialize records, currentUser, formActions and csrfToken here. -->
    <script id="page-data" type="application/json">{}</script>
    <script src="../static/js/script.js" defer></script>
</head>

<body data-page="register">
    <!-- ==================================================
         ACCOUNT ACCESS: Accessible entry
         Skip directly to the account form.
    ================================================== -->
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <!-- ==================================================
         ACCOUNT ACCESS: Initial page and accessible fallback
         The shared account renderer replaces this loading view.
    ================================================== -->
    <main id="app-main">
        <div class="auth-main" id="main-content" tabindex="-1">
            <div class="auth-panel">
                <h1>Create your patient profile</h1>
                <p class="muted">A few details to create your patient account.</p>
                <div class="feedback" id="page-feedback" role="status" hidden></div>
                <div id="page-body" aria-busy="true">
                    <p class="muted">Loading your account form...</p>
                </div>
                <noscript>
                    <p>Enable JavaScript in your browser to use the account form.</p>
                    <a href="index.html">Return to the home page</a>
                </noscript>
            </div>
        </div>
    </main>

    <!-- ==================================================
         SHARED INTERFACE: Confirmation dialogs and feedback
         Dialog contents are created using safe DOM nodes.
    ================================================== -->
    <dialog class="modal" id="app-dialog" aria-labelledby="dialog-heading"></dialog>
    <div class="toast" id="app-toast" role="status" aria-live="polite" hidden></div>
</body>

</html>
